<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal Login</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl overflow-hidden">
        
        <!-- Header Section -->
        <div class="bg-slate-950/60 p-6 border-b border-slate-700 text-center">
            <div class="w-16 h-16 bg-emerald-600/20 border border-emerald-500/40 rounded-2xl flex items-center justify-center mx-auto mb-3 text-emerald-400 text-2xl">
                <i class="fa-solid fa-user-graduate"></i>
            </div>
            <h2 class="text-xl font-bold text-white">Student Visit Portal</h2>
            <p class="text-xs text-slate-400 mt-1">Apni details enter karke login karein</p>
        </div>

        <!-- Error Alert Message (Flask Se Aayega) -->
        {% if error %}
        <div class="mx-6 mt-4 p-3 bg-rose-500/20 border border-rose-500/40 rounded-xl text-rose-400 text-xs flex items-center gap-2">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <!-- Login Form -->
        <form action="/login" method="POST" class="p-6 space-y-4">
            
            <!-- Team ID -->
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Team ID</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 text-sm">
                        <i class="fa-solid fa-users"></i>
                    </span>
                    <input type="text" name="team_id" required placeholder="e.g. TEAM-101" 
                           class="w-full pl-10 pr-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-emerald-500 transition">
                </div>
            </div>

            <!-- Student ID / Roll No -->
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Student ID / Roll No</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 text-sm">
                        <i class="fa-solid fa-id-card"></i>
                    </span>
                    <input type="text" name="student_id" required placeholder="e.g. STU-1001" 
                           class="w-full pl-10 pr-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-emerald-500 transition">
                </div>
            </div>

            <!-- Password -->
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 text-sm">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" name="password" required placeholder="••••••••" 
                           class="w-full pl-10 pr-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-emerald-500 transition">
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full mt-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow-lg transition flex items-center justify-center gap-2 text-xs uppercase tracking-wider">
                <span>Login</span>
                <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </button>
        </form>

        <!-- Footer / Demo Credentials Info -->
        <div class="bg-slate-950/40 p-3 text-center text-[11px] text-slate-500 border-t border-slate-700/50">
            Demo Credentials: Team: <b class="text-slate-300">TEAM-101</b> | Roll: <b class="text-slate-300">STU-1001</b> | Pass: <b class="text-slate-300">password123</b>
        </div>
    </div>

</body>
</html>
